<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header>
    <nav>
      <ul style="display:flex;gap:20px;list-style:none;">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="http://www.columbia.edu/itc/mealac/pritchett/00litlinks/naim/">Publications</a></li>
        <li><a href="{{ '/biography-cv' | relative_url }}">Biography & CV</a></li>
        <li><a href="{{ '/contact' | relative_url }}">Contact Me</a></li>
      </ul>
    </nav>
  </header>
  <main style="max-width:800px;margin:auto;padding:20px;">
    {{ content }}
  </main>
  <footer style="text-align:center;margin-top:40px;">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>
</body>
</html>
